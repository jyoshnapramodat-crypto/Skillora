services:
  # Skillora Full-Stack Web Service (Render)
  - type: web
    name: skillora
    env: node
    plan: free
    region: oregon
    buildCommand: npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: MONGODB_URI
        sync: false # Set your MongoDB Atlas SRV URI in Render Dashboard
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE
        value: 30d
      - key: ADMIN_EMAIL
        value: admin@skillora.dev
      - key: ADMIN_PASSWORD
        value: Admin@Skillora2026!
